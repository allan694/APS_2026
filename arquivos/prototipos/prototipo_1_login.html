<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGA-JA - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Roboto', Arial, sans-serif; }
    body { background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; color: #333; }
    .login-card { background: #ffffff; width: 100%; max-width: 400px; padding: 36px 32px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); text-align: center; border-top: 5px solid #2e7d32; }
    .logo { width: 68px; height: 68px; background: #2e7d32; color: #fff; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; font-size: 22px; margin-bottom: 14px; }
    h1 { font-size: 20px; color: #1e5f9e; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #666; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.8px; }
    .form-group { text-align: left; margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #333; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ccd6e0; border-radius: 6px; font-size: 14px; }
    input:focus { border-color: #1e5f9e; outline: none; }
    .forgot-link { display: block; text-align: right; font-size: 12px; color: #1e5f9e; text-decoration: none; margin-top: -8px; margin-bottom: 20px; }
    .btn-primary { width: 100%; padding: 12px; background: #1e5f9e; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
    .btn-primary:hover { background: #164878; }
    .error-box { margin-top: 16px; padding: 10px; background: #fdecea; border: 1px solid #f5c6cb; color: #b71c1c; font-size: 12px; border-radius: 6px; }
    footer { margin-top: 24px; font-size: 11px; color: #555; text-align: center; max-width: 400px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">ONG</div>
    <h1>SGA-JA – Sistema de Gestão</h1>
    <div class="subtitle">Acesso restrito</div>
    <form onsubmit="event.preventDefault(); window.location.href='prototipo_2_dashboard.html';">
      <div class="form-group">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" placeholder="Digite seu login ou e-mail" value="coord.pedagogico" required>
      </div>
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="••••••••" value="12345678" required>
      </div>
      <a href="#" class="forgot-link">Esqueci minha senha</a>
      <button type="submit" class="btn-primary">Entrar no Sistema</button>
      <div class="error-box">Clique em "Entrar no Sistema" para acessar o Dashboard.</div>
    </form>
  </div>
  <footer>
    SGA-JA v1.0.0 – ONG Jovens Ambientalistas<br>
    Em conformidade com a Lei Geral de Proteção de Dados (LGPD – Lei nº 13.709/2018).
  </footer>
</body>
</html>
